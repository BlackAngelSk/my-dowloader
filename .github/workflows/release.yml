name: "Build & Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller packaging
          pip install -e .

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build PyInstaller bundle
        run: pyinstaller windows.spec --noconfirm --clean

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        env:
          APP_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          $issPath = "build\installer.iss"
          $version = $env:APP_VERSION -replace '^v', ''
          (Get-Content $issPath) -replace '#define MyAppVersion GetEnv\("APP_VERSION"\)', "#define MyAppVersion `"$version`"" | Set-Content $issPath
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAPP_VERSION=$version build\installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniDownloader-Windows-${{ steps.version.outputs.tag }}
          path: dist\OmniDownloader-Setup-*.exe

  # ── Linux: PyInstaller folder bundle → tar.gz + .desktop ───────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system libraries (Qt runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller packaging
          pip install -e .

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build PyInstaller bundle
        run: pyinstaller linux.spec --noconfirm --clean

      - name: Smoke-test the frozen app (headless)
        run: |
          QT_QPA_PLATFORM=offscreen ./dist/OmniDownloader/OmniDownloader --diagnose | tee diagnose.txt
          # A bundle that loads no download modules cannot route a single URL:
          # fail the build rather than shipping a dead app.
          ! grep -q "no download modules loaded" diagnose.txt

      - name: Package tarball
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          mkdir -p pkg
          cp -r dist/OmniDownloader pkg/
          cp build/OmniDownloader.desktop pkg/
          cp build/install_linux.sh pkg/
          chmod +x pkg/install_linux.sh
          tar -czf "OmniDownloader-Linux-x86_64-${TAG}.tar.gz" -C pkg .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniDownloader-Linux-${{ steps.version.outputs.tag }}
          path: OmniDownloader-Linux-x86_64-*.tar.gz

  # ── macOS: PyInstaller .app bundle → .dmg ──────────────────────────
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller packaging
          pip install -e .

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build .app bundle
        env:
          APP_VERSION: ${{ steps.version.outputs.tag }}
        run: pyinstaller macos.spec --noconfirm --clean

      - name: Smoke-test the frozen app (headless)
        run: |
          QT_QPA_PLATFORM=offscreen ./dist/OmniDownloader.app/Contents/MacOS/OmniDownloader --diagnose | tee diagnose.txt
          ! grep -q "no download modules loaded" diagnose.txt

      - name: Build .dmg
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          hdiutil create -volname "OmniDownloader" \
            -srcfolder dist/OmniDownloader.app \
            -ov -format UDZO \
            "OmniDownloader-macOS-arm64-${TAG}.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniDownloader-macOS-${{ steps.version.outputs.tag }}
          path: OmniDownloader-macOS-*.dmg

  create-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OmniDownloader ${{ steps.version.outputs.tag }}
          body: |
            ## OmniDownloader ${{ steps.version.outputs.tag }}

            ### Windows
            Download and run `OmniDownloader-Setup-${{ steps.version.outputs.tag }}.exe`.

            ### macOS (Apple silicon)
            Download `OmniDownloader-macOS-arm64-${{ steps.version.outputs.tag }}.dmg`,
            open it and drag **OmniDownloader** into Applications.  The build is
            unsigned, so the first launch needs right-click → Open, or run
            `xattr -dr com.apple.quarantine /Applications/OmniDownloader.app`.

            ### Linux (x86_64)
            ```
            tar -xzf OmniDownloader-Linux-x86_64-${{ steps.version.outputs.tag }}.tar.gz
            ./install_linux.sh
            ```

            ### Changes
            <!-- Add changelog here -->
          files: |
            artifacts/OmniDownloader-Setup-*.exe
            artifacts/OmniDownloader-Linux-*.tar.gz
            artifacts/OmniDownloader-macOS-*.dmg
          draft: false
          prerelease: false
